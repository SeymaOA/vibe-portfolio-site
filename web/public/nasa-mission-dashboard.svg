<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 900" role="img" aria-labelledby="title desc">
  <title id="title">NASA Mission Control Dashboard</title>
  <desc id="desc">A Java Swing style NASA mission dashboard with APOD image, explanation, and moon travel calculator.</desc>
  <rect width="1460" height="900" fill="#f2f2f2"/>
  <rect x="0" y="0" width="1460" height="38" fill="#ffffff"/>
  <circle cx="20" cy="19" r="10" fill="#d90429"/>
  <text x="40" y="25" font-family="Arial, sans-serif" font-size="18" fill="#111111">NASA Mission Control Dashboard</text>
  <text x="20" y="88" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#202020">Date (YYYY-MM-DD):</text>
  <rect x="210" y="64" width="138" height="28" fill="#ffffff" stroke="#8a99a8"/>
  <text x="218" y="84" font-family="Arial, sans-serif" font-size="16" fill="#111111">2026-05-06</text>
  <rect x="360" y="58" width="150" height="40" fill="#dbe8f5" stroke="#8a99a8"/>
  <text x="386" y="84" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#202020">Load APOD</text>
  <rect x="520" y="58" width="170" height="40" fill="#dbe8f5" stroke="#8a99a8"/>
  <text x="546" y="84" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#202020">Save Favorite</text>

  <text x="14" y="152" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#202020">The Retrograde Dance of Saturn and Neptune</text>
  <rect x="14" y="176" width="714" height="724" fill="#ffffff" stroke="#8a99a8" stroke-width="2"/>
  <rect x="32" y="320" width="676" height="480" fill="#121421"/>
  <g fill="#d8d7ff" opacity="0.85">
    <circle cx="194" cy="526" r="5"/>
    <circle cx="213" cy="535" r="5"/>
    <circle cx="232" cy="548" r="5"/>
    <circle cx="254" cy="558" r="5"/>
    <circle cx="278" cy="572" r="5"/>
    <circle cx="304" cy="584" r="5"/>
    <circle cx="333" cy="596" r="5"/>
    <circle cx="365" cy="609" r="5"/>
    <circle cx="399" cy="620" r="5"/>
    <circle cx="432" cy="634" r="5"/>
    <circle cx="466" cy="646" r="5"/>
    <circle cx="496" cy="662" r="5"/>
    <circle cx="526" cy="676" r="5"/>
    <circle cx="552" cy="688" r="5"/>
  </g>
  <g fill="#ffffff" opacity="0.5">
    <circle cx="82" cy="363" r="1.5"/>
    <circle cx="130" cy="432" r="1.2"/>
    <circle cx="188" cy="382" r="1"/>
    <circle cx="264" cy="466" r="1.4"/>
    <circle cx="356" cy="390" r="1.5"/>
    <circle cx="448" cy="454" r="1"/>
    <circle cx="602" cy="386" r="1.4"/>
    <circle cx="640" cy="524" r="1"/>
    <circle cx="106" cy="708" r="1.2"/>
    <circle cx="292" cy="740" r="1.4"/>
    <circle cx="610" cy="742" r="1.1"/>
  </g>

  <text x="744" y="144" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#202020">Explanation:</text>
  <rect x="744" y="164" width="700" height="548" fill="#ffffff" stroke="#8a99a8"/>
  <text x="758" y="190" font-family="Arial, sans-serif" font-size="18" fill="#111111">
    <tspan x="758" dy="0">What does it mean for Saturn and Neptune to be in retrograde?</tspan>
    <tspan x="758" dy="26">This dashboard loads NASA Astronomy Picture of the Day data,</tspan>
    <tspan x="758" dy="26">displays the title, image, and explanation, and lets users save</tspan>
    <tspan x="758" dy="26">favorite APOD entries for later review.</tspan>
  </text>

  <rect x="748" y="742" width="696" height="158" fill="#f7fbff" stroke="#b5c8dc"/>
  <text x="760" y="770" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#202020">Moon Travel Calculator</text>
  <text x="760" y="804" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#202020">Enter spacecraft speed (km/h):</text>
  <rect x="752" y="822" width="690" height="36" fill="#ffffff" stroke="#8a99a8"/>
  <text x="760" y="846" font-family="Arial, sans-serif" font-size="18" fill="#111111">100</text>
  <rect x="752" y="866" width="690" height="28" fill="#dbe8f5" stroke="#8a99a8"/>
  <text x="978" y="886" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#202020">Calculate Moon Travel Time</text>
</svg>
